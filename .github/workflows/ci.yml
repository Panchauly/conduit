name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace
        # No CONDUIT_PG_URL / Docker here — the Phase 19.6 `pg_backend` suite
        # and the Phase 21.6 `#[cfg(unix)]` UDS test skip or don't compile
        # (Windows) accordingly. See the `test-postgres` job for the former.

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p conduit-core --test pg_backend
        run: cargo test -p conduit-core --test pg_backend
        env:
          CONDUIT_PG_URL: postgres://postgres:conduit@localhost:5432/conduit_ci
      - name: examples/postgres matches expected/
        run: bash examples/postgres/run.sh
        env:
          DATABASE_URL: postgres://postgres:conduit@localhost:5432/conduit_ci

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build conduit CLI
        run: cargo build -p conduit-cli
      - name: sqlite-quickstart matches expected/
        run: bash examples/sqlite-quickstart/run.sh
      - name: embedded example runs
        run: cargo run --manifest-path examples/embedded/Cargo.toml
