[workspace]
resolver = "3"
members = [
    "crates/conduit-core",
    "crates/conduit-cli",
    "crates/conduit-ingest",
    "crates/conduit-client",
    "crates/conduit-adapter-postgres",
    "crates/conduit-backends",
]
# examples/ are standalone Cargo projects (each depends on the engine via a
# path dependency, the way a real consumer would depend on a published
# version) — kept out of the workspace so they build and version
# independently and never affect `cargo build --workspace` / the main lockfile.
exclude = ["examples"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Panchauly/conduit"
authors = ["Conduit Contributors"]
rust-version = "1.88"

[workspace.dependencies]
conduit-core = { path = "crates/conduit-core", version = "0.8.0" }
conduit-ingest = { path = "crates/conduit-ingest", version = "0.8.0" }
conduit-client = { path = "crates/conduit-client", version = "0.8.0" }
conduit-adapter-postgres = { path = "crates/conduit-adapter-postgres", version = "0.8.0" }
conduit-backends = { path = "crates/conduit-backends", version = "0.8.0" }
