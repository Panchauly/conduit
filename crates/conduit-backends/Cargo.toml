[package]
name = "conduit-backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Thin wiring crate: registers Conduit's optional networked-backend factories (Postgres, MySQL, Redis, MongoDB, Neo4j) onto a ConduitRuntime, one Cargo feature per backend."

[dependencies]
conduit-core = { workspace = true }
conduit-adapter-postgres = { workspace = true, optional = true }

[features]
# Phase 28: only Postgres has moved out of conduit-core so far. mysql/redis/
# mongo/neo4j features join `all` as each backend's own crate lands.
postgres = ["dep:conduit-adapter-postgres"]
all = ["postgres"]
default = ["all"]
