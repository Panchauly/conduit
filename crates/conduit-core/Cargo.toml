[package]
name = "conduit-core"
version = "0.5.0-alpha"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

# Phase 19: Postgres SQL backend. Sync `postgres` (no TLS features → no
# openssl); r2d2 pool. The adapter path stays synchronous — the driver's
# internal runtime is not exposed. `with-chrono-0_4` for typed
# timestamptz/timestamp/date binding (Phase 19.3).
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }