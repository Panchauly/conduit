[package]
name = "conduit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Deterministic event projection engine for CQRS/event-sourcing read models."
keywords = ["cqrs", "event-sourcing", "projection", "cdc"]
categories = ["database"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

# Phase 19: Postgres SQL backend. Sync `postgres` (no TLS features → no
# openssl); r2d2 pool. The adapter path stays synchronous — the driver's
# internal runtime is not exposed. `with-chrono-0_4` for typed
# timestamptz/timestamp/date binding (Phase 19.3).
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Phase 22: Redis key-value backend. Sync `redis` client; its own `r2d2`
# feature implements `r2d2::ManageConnection` directly on `redis::Client` —
# no separate r2d2-redis crate needed.
redis = { version = "1", features = ["r2d2"] }

# Phase 23: MongoDB document backend. `sync` feature for a blocking API
# (matching the synchronous adapter path); no r2d2 pool needed — `Client` is
# already an internally-pooled, cheaply-cloneable handle.
mongodb = { version = "3", features = ["sync"] }

# Phase 24: Neo4j graph backend. `neo4rs` is async-only (Bolt protocol, no
# sync feature) — wrapped in a small internal `tokio` runtime, the same
# pattern Phase 19.2 used for the sync `postgres` crate over `tokio-postgres`.
neo4rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
