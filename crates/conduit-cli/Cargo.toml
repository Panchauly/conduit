[package]
name = "conduit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command-line runner for the Conduit projection engine."
keywords = ["cqrs", "event-sourcing", "cli", "projection"]
categories = ["command-line-utilities", "database"]
readme = "README.md"

[[bin]]
name = "conduit"
path = "src/main.rs"

[dependencies]
conduit-core = { workspace = true }
conduit-ingest = { workspace = true }
conduit-backends = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3"
